<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IJS Joki - Panel Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

  <div class="max-w-7xl mx-auto p-4 md:p-8">
    <!-- Header Section -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-white tracking-tight">🚀 Panel Penjualan IJS Joki</h1>
        <p class="text-slate-400 text-sm mt-1">Kelola pesanan, deadline, dan pendapatan bulanan.</p>
      </div>
      <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-5 py-2.5 rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2">
        <i class="fa-solid fa-plus"></i> Tambah Order Baru
      </button>
    </div>

    <!-- Stat Cards -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-8">
      <div class="bg-slate-800/80 border border-slate-700/60 p-6 rounded-2xl shadow-xl backdrop-blur-sm">
        <div class="flex items-center justify-between">
          <span class="text-slate-400 text-sm font-medium">Total Order Bulan Ini</span>
          <div class="w-10 h-10 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center">
            <i class="fa-solid fa-cart-shopping"></i>
          </div>
        </div>
        <p id="total-orders" class="text-3xl md:text-4xl font-black text-white mt-3">0</p>
      </div>

      <div class="bg-slate-800/80 border border-slate-700/60 p-6 rounded-2xl shadow-xl backdrop-blur-sm">
        <div class="flex items-center justify-between">
          <span class="text-slate-400 text-sm font-medium">Omset Bulan Ini</span>
          <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center">
            <i class="fa-solid fa-wallet"></i>
          </div>
        </div>
        <p id="total-revenue" class="text-3xl md:text-4xl font-black text-emerald-400 mt-3">Rp 0</p>
      </div>
    </div>

    <!-- Table Orders -->
    <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl shadow-xl overflow-hidden">
      <div class="p-5 border-b border-slate-700/60 flex items-center justify-between">
        <h2 class="font-bold text-slate-200 text-lg">Daftar Orderan</h2>
        <button onclick="loadData()" class="text-slate-400 hover:text-white transition">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-slate-900/50 text-slate-400 border-b border-slate-700/60">
              <th class="p-4">Nama / No WA</th>
              <th class="p-4">Item Jasa</th>
              <th class="p-4">Harga</th>
              <th class="p-4">Tanggal Order</th>
              <th class="p-4">Deadline</th>
              <th class="p-4">Status</th>
            </tr>
          </thead>
          <tbody id="order-rows" class="divide-y divide-slate-700/40 text-slate-300">
            <tr>
              <td colspan="6" class="p-6 text-center text-slate-500">Memuat data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal Form Input -->
  <div id="orderModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>
      
      <h3 class="text-xl font-bold text-white mb-4">Input Orderan Baru</h3>
      
      <form id="orderForm" onsubmit="submitForm(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">TIPE ENQUIRY</label>
          <select id="type" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500">
            <option value="Buy">Buy (Order)</option>
            <option value="Ask">Ask (Tanya-tanya)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">NAMA CLIENT</label>
          <input type="text" id="clientName" required placeholder="Contoh: Budi" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">ITEM / JASA YANG DIORDER</label>
          <input type="text" id="item" required placeholder="Contoh: Makalah Biologi" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">HARGA (RP)</label>
          <input type="number" id="price" required placeholder="150000" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">TANGGAL ORDER</label>
            <input type="date" id="orderDate" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500 [color-scheme:dark]">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">DEADLINE</label>
            <input type="date" id="deadline" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500 [color-scheme:dark]">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold p-3 rounded-xl mt-2 transition">
          Simpan Order & Copy Rename WA
        </button>
      </form>
    </div>
  </div>

  <script>
    // GANTI SESUAI URL DEPLOYMENT GOOGLE APPS SCRIPT
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxJ0qOZNoYGq99cRSnrhvki8OHxLwNhgQvIWhU1TwzSLpTx3xWjC8YcuYtsjTjtLg4/exec";

    // Set default tanggal hari ini pada Date Picker
    document.getElementById('orderDate').valueAsDate = new Date();

    function openModal() {
      document.getElementById('orderModal').classList.remove('hidden');
      document.getElementById('orderModal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('orderModal').classList.add('hidden');
      document.getElementById('orderModal').classList.remove('flex');
    }

    async function loadData() {
      try {
        const res = await fetch(GAS_URL);
        const result = await res.json();
        
        if (result.status === "success") {
          const orders = result.data;
          const currentMonth = new Date().getMonth();
          const currentYear = new Date().getFullYear();
          
          let monthCount = 0;
          let monthRevenue = 0;
          
          const tbody = document.getElementById('order-rows');
          tbody.innerHTML = '';

          if (orders.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-500">Belum ada data order.</td></tr>`;
            return;
          }

          orders.reverse().forEach(ord => {
            const ordDate = new Date(ord.orderDate);
            if (ordDate.getMonth() === currentMonth && ordDate.getFullYear() === currentYear) {
              monthCount++;
              monthRevenue += Number(ord.price || 0);
            }

            tbody.innerHTML += `
              <tr class="hover:bg-slate-700/20 transition">
                <td class="p-4 font-semibold text-white">${ord.name}</td>
                <td class="p-4">${ord.item}</td>
                <td class="p-4 text-emerald-400 font-medium">Rp ${Number(ord.price).toLocaleString('id-ID')}</td>
                <td class="p-4 text-slate-400">${ord.orderDate}</td>
                <td class="p-4 text-amber-400 font-medium">${ord.deadline}</td>
                <td class="p-4">
                  <span class="bg-amber-500/10 text-amber-400 px-2.5 py-1 rounded-lg text-xs border border-amber-500/20 font-medium">
                    ${ord.status}
                  </span>
                </td>
              </tr>
            `;
          });

          document.getElementById('total-orders').innerText = monthCount;
          document.getElementById('total-revenue').innerText = `Rp ${monthRevenue.toLocaleString('id-ID')}`;
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function submitForm(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerText = "Menyimpan...";
      btn.disabled = true;

      const type = document.getElementById('type').value;
      const name = document.getElementById('clientName').value;
      const item = document.getElementById('item').value;
      const price = document.getElementById('price').value;
      const orderDateVal = document.getElementById('orderDate').value;
      const deadlineVal = document.getElementById('deadline').value;

      const d = new Date(orderDateVal);
      const firstChatDate = `${d.getDate()}/${d.getMonth() + 1}`;

      const payload = {
        action: "add_order",
        type: type,
        name: name,
        item: item,
        price: price,
        orderDate: orderDateVal,
        deadline: deadlineVal,
        firstChatDate: firstChatDate
      };

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.status === "success") {
          // Copy saran name ke clipboard
          await navigator.clipboard.writeText(result.suggestedName);
          alert(`✅ Order Berhasil Disimpan!\n\nSaran Nama Kontak WA:\n${result.suggestedName}\n\n(Nama kontak sudah otomatis tersalin ke clipboard!)`);
          
          closeModal();
          document.getElementById('orderForm').reset();
          document.getElementById('orderDate').valueAsDate = new Date();
          loadData();
        }
      } catch (err) {
        alert("Gagal menyimpan data.");
      } finally {
        btn.innerText = "Simpan Order & Copy Rename WA";
        btn.disabled = false;
      }
    }

    loadData();
  </script>
</body>
</html>
