<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>IJS Joki Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
  <div class="max-w-5xl mx-auto">
    <h1 class="text-3xl font-bold mb-6 text-gray-800">📊 Panel Penjualan Joki IJS</h1>
    
    <!-- Card Omset -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
      <div class="bg-white p-6 rounded-xl shadow-sm border">
        <h3 class="text-gray-500 text-sm">Total Orderan Bulan Ini</h3>
        <p id="total-orders" class="text-3xl font-bold text-blue-600">0</p>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-sm border">
        <h3 class="text-gray-500 text-sm">Pendapatan Bulan Ini</h3>
        <p id="total-revenue" class="text-3xl font-bold text-green-600">Rp 0</p>
      </div>
    </div>

    <!-- Tabel Order -->
    <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-gray-50 border-b text-gray-600 text-sm">
            <th class="p-4">Client</th>
            <th class="p-4">Item</th>
            <th class="p-4">Harga</th>
            <th class="p-4">Deadline</th>
            <th class="p-4">Status</th>
          </tr>
        </thead>
        <tbody id="order-rows"></tbody>
      </table>
    </div>
  </div>

  <script>
    const GAS_URL = "URL_WEB_APP_GOOGLE_APPS_SCRIPT_KAMU";

    async function loadData() {
      const res = await fetch(GAS_URL);
      const result = await res.json();
      
      if (result.status === "success") {
        const orders = result.data;
        const currentMonth = new Date().getMonth();
        
        let monthCount = 0;
        let monthRevenue = 0;
        
        const tbody = document.getElementById('order-rows');
        tbody.innerHTML = '';

        orders.forEach(ord => {
          const ordDate = new Date(ord.orderDate);
          if (ordDate.getMonth() === currentMonth) {
            monthCount++;
            monthRevenue += Number(ord.price);
          }

          tbody.innerHTML += `
            <tr class="border-b text-sm">
              <td class="p-4 font-medium">${ord.name}</td>
              <td class="p-4">${ord.item}</td>
              <td class="p-4">Rp ${Number(ord.price).toLocaleString('id-ID')}</td>
              <td class="p-4">${ord.deadline}</td>
              <td class="p-4"><span class="bg-yellow-100 text-yellow-800 px-2 py-1 rounded text-xs">${ord.status}</span></td>
            </tr>
          `;
        });

        document.getElementById('total-orders').innerText = monthCount;
        document.getElementById('total-revenue').innerText = `Rp ${monthRevenue.toLocaleString('id-ID')}`;
      }
    }

    loadData();
  </script>
</body>
</html>
